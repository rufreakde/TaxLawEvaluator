    description: Primary Gross Salary
    source: income[0].amount
  - id: b
    description: Secondary Gross Salary
    source: income[1].amount
  - id: c
    description: Tax Free Allowance
    value: 11604
tax_rules:
  - name: Simplified Net Calculation
    formula: ($a + $b) * 0.65
    description: Estimated net income after 35% total deduction (tax + social)
  - name: Social Security Contribution
    formula: ($a + $b) * 0.20
    description: Approximate 20% social security flat rate
  - name: Taxable Base
    formula: ($a + $b) - $c
    description: Total income minus tax-free allowance
  - name: Additional Rule - 1774177572918
    formula: $a * 0.05
